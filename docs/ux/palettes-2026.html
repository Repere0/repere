<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Palettes Repère</title>
<style>
/* Police d'affiche : Bricolage Grotesque, embarquee par l'application (apps/mobile). Ici, repli systeme : ouvrir avec la police installee pour un rendu identique a la capture. */
* { box-sizing: border-box; margin: 0; }
body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #d9d6cf; padding: 24px; }
.grille { display: grid; grid-template-columns: repeat(4, 360px); gap: 24px; }
.tel { border-radius: 28px; overflow: hidden; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 1180px; }
h1 { font: 800 15px/1.2 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: .02em; }
.titre { font: 800 13px/1.3 "Bricolage Grotesque", system-ui, sans-serif; opacity: .8; }
.etq { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.pt { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.ville { font: 800 40px/1 "Bricolage Grotesque", system-ui, sans-serif; margin-top: 2px; }
.carte { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.rep { font: 800 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
.chiffre { font: 800 40px/1 "Bricolage Grotesque", system-ui, sans-serif; }
.note { font-size: 14px; }
.ligne { display: flex; justify-content: space-between; font-size: 14px; }
.piste { height: 10px; border-radius: 5px; overflow: hidden; }
.piste > div { height: 100%; border-radius: 5px; }
.vote { display: flex; height: 18px; border-radius: 6px; overflow: hidden; }
.src { font-size: 13px; font-weight: 600; }
.chaine { display: flex; flex-direction: column; gap: 8px; }
.maillon { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.maillon b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.nuancier { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.nu { font: 11px/1.3 ui-monospace, monospace; padding: 6px; border-radius: 8px; width: 104px; }
.nu i { display: block; height: 22px; border-radius: 5px; margin-bottom: 4px; border: 1px solid rgba(0,0,0,.08); }
.ko { color: #a00; font-weight: 700; }
.verdict { font-size: 13px; line-height: 1.35; padding: 10px; border-radius: 10px; }
</style></head>
<body><div class="grille" id="g"></div>
<script>
/* Chiffres reels de Meaux (donnees du 29/09/2026) : OFGL 2025, DGCL, Assemblee (scrutin n° 8430), RNE. */
const ECHELONS = { ville: "#0e7490", agglo: "#0891b2", dept: "#b45309", region: "#6d28d9", france: "#1d1d1f" };
const GELEES = Object.values(ECHELONS);
const amp = h => { const v = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); return Math.max(...v) - Math.min(...v); };
const GRIS_VOTE = { p: "#1d1d1f", c: "#6b675f", a: "#ddd8ce" };   /* identiques dans les quatre : un vote n'a pas de couleur */
const P = [
  { nom: "A · Monochrome + un accent", conforme: true,
    sol: "#f2efe9", carte: "#ffffff", encre: "#1d1d1f", sourd: "#6b675f", piste: "#ece8e0", rayon: 20,
    donnee: "#0e7490", teinteCarte: null, points: { ville: "#0e7490", agglo: "#1d1d1f", dept: "#1d1d1f", region: "#1d1d1f", france: "#1d1d1f" },
    verdict: "Sobre et sûr, mais la couleur ne porte plus l'échelon : on perd le seul code couleur qui a un sens dans Repère." },
  { nom: "B · Territorial doux", conforme: true,
    sol: "#f2efe9", carte: "#ffffff", encre: "#1d1d1f", sourd: "#6b675f", piste: "#ece8e0", rayon: 20,
    donnee: "#0e7490", teintes: { ville: "#dbeaee", france: "#ecebe8" }, points: ECHELONS,
    verdict: "Recommandée. Chaque carte prend la teinte de l'échelon qui décide (amplitude ≤ 20 : conforme à l'invariant 7 sans l'amender). Texte toujours en encre : la teinte ne porte jamais seule l'information." },
  { nom: "C · Éditorial contemporain", conforme: true,
    sol: "#f6f3ec", carte: "transparent", encre: "#111111", sourd: "#5f5b54", piste: "#e3ded4", rayon: 0, filet: true,
    donnee: "#111111", teinteCarte: null, points: ECHELONS,
    verdict: "Belle et conforme, mais froide sur mobile : des filets au lieu de cartes allongent la lecture et affaiblissent le « une question = un bloc »." },
  { nom: "D · Expressif désaturé", conforme: false,
    sol: "#eeebe4", carte: "#fbfaf7", encre: "#23211d", sourd: "#67635b", piste: "#e4e0d8", rayon: 20,
    donnee: "#b07d62", second: "#5f6f86", teintes: { ville: "#e9ede6", france: "#ecebe8", dept: "#f1e9e3" },
    points: { ville: "#7a8f7b", agglo: "#5f6f86", dept: "#b07d62", region: "#b48a8f", france: "#23211d" },
    verdict: "Refusée. Sauge, argile, ardoise, vieux rose : trois teintes sur quatre hors règle (amplitude 39 à 78 ; la sauge passe à 21) et trop proches de codes de partis (vert, rose, bleu ardoise). Exigerait d'amender l'invariant 7." },
];
const esc = s => s;
const g = document.getElementById("g");
for (const p of P) {
  const t = k => (p.teintes && p.teintes[k]) || p.carte;
  const carte = (k, contenu) => `<div class="carte" style="background:${t(k)};border-radius:${p.rayon}px;${p.filet ? `border-top:2px solid ${p.encre};padding-left:0;padding-right:0;` : ""}">${contenu}</div>`;
  const barre = (lib, v, coul) => `<div class="ligne"><span style="color:${p.sourd}">${lib}</span><b>${v} € sur 100 € dépensés</b></div><div class="piste" style="background:${p.piste}"><div style="width:${v}%;background:${coul}"></div></div>`;
  const pts = p.points;
  const nuancier = [["sol", p.sol], ["carte", p.carte === "transparent" ? p.sol : p.carte], ["encre", p.encre], ["sourd", p.sourd], ["donnée", p.donnee], ...(p.second ? [["donnée 2", p.second]] : []),
    ...Object.entries(p.teintes || {}).map(([k, v]) => ["teinte " + k, v]), ...Object.entries(pts).filter(([, v]) => !GELEES.includes(v) && v !== p.encre).map(([k, v]) => ["point " + k, v])];
  g.insertAdjacentHTML("beforeend", `
  <div class="tel" style="background:${p.sol};color:${p.encre}">
    <h1>${p.nom}</h1>
    <div><div class="etq" style="color:${p.sourd}">Chez vous</div><div class="ville">Meaux</div><div class="note" style="color:${p.sourd}">Seine-et-Marne · Île-de-France</div></div>
    ${carte("ville", `<div class="etq" style="color:${p.sourd}"><span class="pt" style="background:${pts.ville}"></span>L'argent de la commune</div>
      <div class="rep">En 2025, Meaux a dépensé 121,3 M€.</div>
      <div><div class="chiffre">2 123 €</div><div class="note" style="color:${p.sourd}">par habitant, sur l'année</div></div>
      ${barre("Salaires", 47, p.donnee)}${barre("Travaux et équipements", 28, p.second || p.donnee)}
      <div class="src" style="color:${p.sourd}">ⓘ Calculé par Repère · source</div>`)}
    ${carte("france", `<div class="etq" style="color:${p.sourd}"><span class="pt" style="background:${pts.france}"></span>Ce qu'a voté votre député</div>
      <div class="rep">Béatrice Roullaud a voté pour.</div>
      <div class="vote"><div style="width:67.7%;background:${GRIS_VOTE.p}"></div><div style="width:1.3%;background:${GRIS_VOTE.c}"></div><div style="width:31%;background:${GRIS_VOTE.a}"></div></div>
      <div class="note" style="color:${p.sourd}">378 pour · 7 contre · 173 abstentions — le texte a été adopté le 21 juillet 2026.</div>`)}
    ${carte("dept", `<div class="etq" style="color:${p.sourd}"><span class="pt" style="background:${pts.dept}"></span>Qui décide</div>
      <div class="chaine">${[["ville", "Commune", "Jean-François COPE"], ["agglo", "Intercommunalité", "Ca Du Pays De Meaux"], ["dept", "Département", "Jean-François PARIGI"], ["region", "Région", "Valérie PÉCRESSE"], ["france", "Assemblée nationale", "Béatrice Roullaud"]]
        .map(([e, n, q]) => `<div class="maillon"><span class="pt" style="background:${pts[e]};margin-top:4px"></span><div><b style="color:${p.sourd}">${n}</b>${q}</div></div>`).join("")}</div>`)}
    <div class="nuancier">${nuancier.map(([n, h]) => { const a = amp(h), ok = GELEES.includes(h) || a <= 24; return `<div class="nu" style="background:${p.carte === "transparent" ? "#fff" : p.carte}"><i style="background:${h}"></i>${n}<br>${h} · amp. ${a}${ok ? "" : ' <span class="ko">hors règle</span>'}</div>`; }).join("")}</div>
    <div class="verdict" style="background:${p.conforme ? "#ffffff" : "#fbeaea"}"><b>${p.conforme ? "Conforme à l'invariant 7." : "Non conforme à l'invariant 7."}</b> ${p.verdict}</div>
  </div>`);
}
</script></body></html>
