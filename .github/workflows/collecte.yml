# Collecte quotidienne des donnees publiques de Repere.
#
# POURQUOI ICI et pas ailleurs : le conteneur de travail de Claude ne peut pas
# joindre data.assemblee-nationale.fr, et un poste allume de facon irreguliere ne
# fait pas une collecte quotidienne. Un runner GitHub le fait gratuitement, a heure
# fixe, avec une trace publique de chaque execution — et le journal des echecs est
# versionne comme le reste.
#
# CE QUE CE WORKFLOW NE FAIT PAS ENCORE : il ne reconstruit pas l'application et ne
# deploie pas. C'est volontaire. La regeneration engendre un fichier de 17 Mo par
# execution ; l'activer sans arbitrage ferait grossir le depot de 6 Mo par jour.
# Voir l'etape « Reconstruire et deployer » en bas, commentee, avec ce qu'il faut
# pour l'activer.

name: Collecte quotidienne

on:
  schedule:
    # 05h47 UTC — une heure creuse, et volontairement pas a l'heure ronde : les
    # runners GitHub sont satures a :00, et les serveurs de l'Assemblee aussi.
    - cron: "47 5 * * *"
  workflow_dispatch:        # pour la lancer a la main depuis l'onglet Actions

permissions:
  contents: write           # necessaire pour committer les donnees normalisees

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Telecharger les sources
        id: collecte
        # continue-on-error : une source indisponible ne doit pas empecher les
        # autres d'etre ingerees, ni empecher le journal d'etre commite. C'est le
        # journal qui porte l'echec, pas l'absence de commit.
        continue-on-error: true
        run: python3 outils/collecte.py

      - name: Depiler les archives
        run: |
          set -e
          cd data
          for z in *.zip; do
            [ -e "$z" ] || continue
            dossier="${z%.json.zip}"
            dossier="${dossier%.zip}"
            rm -rf "brut_$dossier"
            mkdir -p "brut_$dossier"
            unzip -oq "$z" -d "brut_$dossier"
            echo "$z -> brut_$dossier"
          done

      - name: Normaliser l'agenda parlementaire
        # Les chemins suivent la structure des archives officielles : Agenda.json.zip
        # contient json/reunion/, AMO30 contient json/organe/.
        run: |
          set -e
          python3 outils/agenda_an.py \
            data/brut_Agenda/json \
            data/brut_AMO30/json \
            outils/agenda_an.json

      - name: Verifier que la sortie est utilisable
        # Un fichier produit n'est pas un fichier valide. On relit ce qui vient
        # d'etre ecrit, sans reutiliser une ligne du script qui l'a ecrit.
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("outils/agenda_an.json", encoding="utf-8"))
          assert d.get("v") == 1, "version de format inattendue"
          assert len(d["r"]) > 5000, "trop peu de reunions : %d" % len(d["r"])
          assert d["org"], "table des instances vide"
          assert all(0 <= e["o"] < len(d["org"]) for e in d["r"]), "index d'instance hors table"
          assert "acteurRef" not in json.dumps(d)[:2000000], "une presence nominative a fuite"
          print("agenda : %d reunions, %d instances" % (len(d["r"]), len(d["org"])))
          PY

      - name: Committer si quelque chose a change
        run: |
          set -e
          git config user.name "Collecte Repere"
          git config user.email "repere0@protonmail.com"
          git add outils/agenda_an.json data/journal_collecte.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau aujourd'hui."
          else
            git commit -m "Collecte du $(date -u +%d/%m/%Y)"
            git push
          fi

      - name: Signaler les echecs de collecte
        # Le job passe au rouge SI et seulement SI une source a echoue — apres que
        # le journal a ete commite. Un echec visible dans l'onglet Actions, et une
        # ligne datee dans le depot : les deux, pas l'un ou l'autre.
        if: steps.collecte.outcome == 'failure'
        run: |
          echo "::warning::Au moins une source n'a pas pu etre telechargee."
          cat data/journal_collecte.json
          exit 1

