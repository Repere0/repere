# Collecte quotidienne des donnees publiques de Repere — version 2.
#
# CE QUI CHANGE PAR RAPPORT A LA VERSION 1 : la boucle est fermee. La version 1
# collectait et commitait ; le resultat n'atteignait personne, parce qu'il fallait
# reconstruire et redeployer a la main un fichier de 17 Mo. Depuis la v18.15, l'agenda
# est SERVI A PART (650 Ko) et build_pwa prefere le fichier collecte a la copie figee
# dans l'application. Reconstruire ne coute donc plus que quelques secondes de Python,
# et Netlify n'envoie que les fichiers qui ont change — soit 650 Ko par jour, pas 17 Mo.
#
# CE QU'IL FAUT AVOIR DANS LE DEPOT pour que l'etape de reconstruction fonctionne :
#   - app_repere_v18_18.html      (l'application ; le script prend la plus recente)
#   - site/sw.js, site/manifest.webmanifest, site/icones/, site/confidentialite.html
#   - site/index.html             (reference de la preuve)
#   - app_repere_v18_9.html.bak   (source de la preuve)
# Les deux derniers ne changent JAMAIS : ils servent a prouver, chaque matin, que la
# transformation produit exactement le site fait a la main a l'origine. Sans eux,
# build_pwa refuse de produire quoi que ce soit — et c'est voulu.

# 19/08/2026 — checkout passe en v5 et setup-python en v6 : les versions precedentes
# ciblent Node 20, que les runners GitHub forcent deja sur Node 24 depuis septembre 2025.
# L'avertissement etait sans consequence aujourd'hui, et deviendra une panne le jour ou
# Node 20 sera retire. Un avertissement qu'on laisse s'installer finit par etre du bruit
# qu'on ne lit plus.

name: Collecte quotidienne

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Telecharger les sources
        id: collecte
        continue-on-error: true
        run: python3 outils/collecte.py

      - name: Depiler les archives
        run: |
          set -e
          cd data
          for z in *.zip; do
            [ -e "$z" ] || continue
            dossier="${z%.json.zip}"; dossier="${dossier%.zip}"
            rm -rf "brut_$dossier"; mkdir -p "brut_$dossier"
            unzip -oq "$z" -d "brut_$dossier"
            echo "$z -> brut_$dossier"
          done

      - name: Normaliser l'agenda parlementaire
        run: |
          set -e
          python3 outils/agenda_an.py \
            data/brut_Agenda/json \
            data/brut_AMO30/json \
            outils/agenda_an.json

      - name: Verifier que la sortie est utilisable
        # Un fichier produit n'est pas un fichier valide. On relit ce qui vient d'etre
        # ecrit, sans reutiliser une ligne du script qui l'a ecrit.
        run: |
          python3 - <<'PY'
          import json, datetime
          d = json.load(open("outils/agenda_an.json", encoding="utf-8"))
          assert d.get("v") == 1, "version de format inattendue"
          assert len(d["r"]) > 5000, "trop peu de reunions : %d" % len(d["r"])
          assert d["org"], "table des instances vide"
          assert all(0 <= e["o"] < len(d["org"]) for e in d["r"]), "index d'instance hors table"
          assert "acteurRef" not in json.dumps(d)[:2000000], "une presence nominative a fuite"
          # La date de collecte doit etre celle du jour : un fichier non regenere qui
          # passerait tous les autres controles serait invisible sans celui-ci.
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          assert d.get("maj") == today, "date de collecte %r au lieu de %s" % (d.get("maj"), today)
          print("agenda : %d reunions, %d instances, collecte du %s" % (len(d["r"]), len(d["org"]), d["maj"]))
          PY

      - name: Committer si quelque chose a change
        run: |
          set -e
          git config user.name "Collecte Repere"
          git config user.email "repere0@protonmail.com"
          git add outils/agenda_an.json data/journal_collecte.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau aujourd'hui."
          else
            git commit -m "Collecte du $(date -u +%d/%m/%Y)"
            git push
          fi

      # ---------------------------------------------------------------- publication
      - name: Reconstruire le site
        id: build
        run: |
          set -e
          APP=$(ls -1 app_repere_v18_*.html | grep -v '\.bak$' | sort -V | tail -1)
          echo "application : $APP"
          python3 outils/build_pwa_reconstruit.py "$APP" site site_engendre
          # L'agenda servi DOIT etre celui de la collecte, pas la copie embarquee.
          python3 - <<'PY'
          import json, datetime
          d = json.load(open("site_engendre/donnees/agenda_an.json", encoding="utf-8"))
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          assert d.get("maj") == today, \
              "le site servirait un agenda du %r : la substitution n'a pas eu lieu" % d.get("maj")
          print("site : agenda du %s, %d reunions" % (d["maj"], len(d["r"])))
          PY

      - name: Deployer sur Netlify
        # Ne se declenche que si les deux secrets existent : sans eux, le job reste vert
        # et la collecte reste utile, au lieu d'echouer tous les matins.
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=site_engendre --prod --message "Collecte du $(date -u +%d/%m/%Y)"

      - name: Signaler les echecs de collecte
        if: steps.collecte.outcome == 'failure'
        run: |
          echo "::warning::Au moins une source n'a pas pu etre telechargee."
          cat data/journal_collecte.json
          exit 1

# ---------------------------------------------------------------------------
# LES DEUX SECRETS se creent dans Settings > Secrets and variables > Actions :
#   NETLIFY_AUTH_TOKEN  — Netlify > User settings > Applications > Personal access token
#   NETLIFY_SITE_ID     — Netlify > Site configuration > Site ID
# Personne d'autre que toi ne doit les voir : ne les colle jamais dans une
# conversation, ici ou ailleurs.
# ---------------------------------------------------------------------------
