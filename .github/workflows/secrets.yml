# Recherche de secrets (17/11/2026) : une PR ou un push qui ajoute une cle d'API, un jeton ou une cle privee echoue.
# Outil : gitleaks (licence MIT), via son action officielle. Gratuit et sans licence pour un depot de compte personnel ;
# une organisation GitHub demanderait le secret GITLEAKS_LICENSE (gratuit, a demander sur gitleaks.io) : dans ce cas
# le job le dira.
# Chaque lundi, l'historique complet est relu (fetch-depth: 0), pour les regles ajoutees depuis.
# Complement, pas remplacement : le « secret scanning » de GitHub (Settings > Code security), gratuit sur un depot
# public, couvre les jetons des grands fournisseurs et bloque le push (AUDIT-REPO.md).
name: Recherche de secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # l'action lit la liste des commits d'une PR

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recuperer le depot (historique complet)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Chercher des secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
