<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repère — qui décide chez vous</title>
<meta name="description" content="Qui décide chez vous, et où va votre argent. Les élus, la circonscription et les comptes de votre commune, à partir des sources officielles. Aucun compte, aucun traceur.">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Repère">
<meta property="og:title" content="Repère — qui décide chez vous">
<meta property="og:description" content="Les élus, la circonscription et les comptes de votre commune, à partir des sources officielles.">
<!-- Aucune og:image : elle serait servie depuis un hote, et le partage d'un lien
     ferait connaitre a ce tiers qui regarde. La vignette peut rester vide. -->
<!-- La couleur de la barre du navigateur est un jeton GELE du produit
     (--e-ville). Elle valait un bleu-vert proche, mais absent de la palette, que
     le controle de l'invariant 7 ne voyait pas : il ne lisait que les .js et les
     .css, jamais ce document ni le manifeste. Il les lit maintenant. -->
<meta name="theme-color" content="#0e7490">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<!-- AUCUNE POLICE CHARGEE DEPUIS UN HOTE TIERS. Un lien vers fonts.googleapis.com
     ferait connaitre a Google l'adresse IP de chaque lecteur de Repere, a chaque
     ouverture : c'est exactement ce que l'invariant 2 refuse, meme s'il ne parle
     que du stockage. La mesure qui a decide : hors ligne, ces requetes echouaient
     et la page basculait de toute facon sur les polices du systeme. On prend donc
     les polices du systeme tout de suite, pour tout le monde, sans tiers. -->
</head>
<body>
<div id="root"></div>
<noscript>Repère a besoin de JavaScript pour lire les données publiques qu'il embarque. Les sources officielles restent consultables sur data.gouv.fr.</noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
